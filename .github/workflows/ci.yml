name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: test Edge Functions code
        working-directory: supabase/functions
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test
        run: deno test --allow-env --allow-read _shared/

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: typecheck, i18n check, build
        working-directory: miniapp
        env:
          VITE_API_URL: https://example.supabase.co/functions/v1/api
        run: |
          npm ci
          npm run build
